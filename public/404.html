<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ICpEP-Oman TechTalk 2026</title>
    <script>
      // Single Page App redirect for GitHub Pages
      // If hosted on GitHub Pages subfolder (e.g. icpepoman-dotcom.github.io/TechTalk2026/), keep 1 segment.
      var isGitHubPagesSubpath = window.location.hostname.indexOf('github.io') !== -1;
      var pathSegmentsToKeep = isGitHubPagesSubpath ? 1 : 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="background-color: #071326; color: #fcedbe; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to ICpEP-Oman TechTalk 2026...</p>
  </body>
</html>
