<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bpGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5db" />
      <stop offset="45%" stop-color="#e5b94c" />
      <stop offset="100%" stop-color="#a07214" />
    </linearGradient>
    <linearGradient id="bpDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c234b" />
      <stop offset="100%" stop-color="#050e1f" />
    </linearGradient>
    <filter id="bpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e5b94c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Shield / Hexagonal Emblem -->
  <rect x="25" y="25" width="350" height="350" rx="36" fill="url(#bpDark)" stroke="url(#bpGold)" stroke-width="5" filter="url(#bpGlow)" />
  <rect x="40" y="40" width="320" height="320" rx="26" fill="none" stroke="url(#bpGold)" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6" />

  <!-- Four Architectural Pillars Symbolizing Strength & Venue Solutions -->
  <g transform="translate(110, 85)" fill="url(#bpGold)">
    <!-- Top Architrave / Pediment -->
    <path d="M-15,10 L195,10 L180,-10 L0,-10 Z" />
    <rect x="-10" y="12" width="200" height="8" rx="2" opacity="0.9" />

    <!-- 4 Fluted Pillars -->
    <!-- Pillar 1 -->
    <g transform="translate(5, 24)">
      <rect x="0" y="0" width="26" height="105" rx="3" />
      <rect x="4" y="0" width="4" height="105" fill="#fff" opacity="0.4" />
      <rect x="-4" y="105" width="34" height="10" rx="2" />
    </g>
    <!-- Pillar 2 -->
    <g transform="translate(55, 24)">
      <rect x="0" y="0" width="26" height="105" rx="3" />
      <rect x="4" y="0" width="4" height="105" fill="#fff" opacity="0.4" />
      <rect x="-4" y="105" width="34" height="10" rx="2" />
    </g>
    <!-- Pillar 3 -->
    <g transform="translate(105, 24)">
      <rect x="0" y="0" width="26" height="105" rx="3" />
      <rect x="4" y="0" width="4" height="105" fill="#fff" opacity="0.4" />
      <rect x="-4" y="105" width="34" height="10" rx="2" />
    </g>
    <!-- Pillar 4 -->
    <g transform="translate(155, 24)">
      <rect x="0" y="0" width="26" height="105" rx="3" />
      <rect x="4" y="0" width="4" height="105" fill="#fff" opacity="0.4" />
      <rect x="-4" y="105" width="34" height="10" rx="2" />
    </g>

    <!-- Bottom Base Plinth -->
    <rect x="-20" y="142" width="220" height="12" rx="3" />
  </g>

  <!-- Shining Guiding Star in Pediment -->
  <g transform="translate(200, 72)" fill="#ffffff">
    <polygon points="0,-14 4,-4 14,0 4,4 0,14 -4,4 -14,0 -4,-4" />
  </g>

  <!-- Typography -->
  <text x="200" y="275" font-family="'Cinzel', serif, system-ui" font-size="20" font-weight="800" fill="url(#bpGold)" text-anchor="middle" letter-spacing="3">
    BRIGHT PILLARS
  </text>
  <text x="200" y="300" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fcedbe" text-anchor="middle" letter-spacing="2">
    THE WORLD BRIGHT PILLARS LLC
  </text>
  <text x="200" y="322" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#9db2ce" text-anchor="middle" letter-spacing="1">
    EVENTS &amp; VENUE SOLUTIONS · SULTANATE OF OMAN
  </text>
</svg>
