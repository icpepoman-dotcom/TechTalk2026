<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="gipaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c2" />
      <stop offset="50%" stop-color="#e5b94c" />
      <stop offset="100%" stop-color="#b8861e" />
    </linearGradient>
    <linearGradient id="gipaNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2447" />
      <stop offset="100%" stop-color="#061224" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e5b94c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Circular Border with Gold Accents -->
  <circle cx="200" cy="200" r="185" fill="url(#gipaNavy)" stroke="url(#gipaGold)" stroke-width="6" filter="url(#goldGlow)" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="url(#gipaGold)" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7" />

  <!-- Laurel Wreath Leaves (Left) -->
  <g fill="url(#gipaGold)" opacity="0.85">
    <path d="M 100,240 C 90,220 95,190 105,175 C 105,185 110,210 100,240 Z" />
    <path d="M 85,200 C 80,180 88,155 102,142 C 100,155 102,175 85,200 Z" />
    <path d="M 85,155 C 85,135 98,115 115,108 C 110,120 110,140 85,155 Z" />
    <path d="M 105,115 C 112,98 130,85 148,85 C 138,95 132,112 105,115 Z" />
  </g>

  <!-- Laurel Wreath Leaves (Right) -->
  <g fill="url(#gipaGold)" opacity="0.85">
    <path d="M 300,240 C 310,220 305,190 295,175 C 295,185 290,210 300,240 Z" />
    <path d="M 315,200 C 320,180 312,155 298,142 C 300,155 298,175 315,200 Z" />
    <path d="M 315,155 C 315,135 302,115 285,108 C 290,120 290,140 315,155 Z" />
    <path d="M 295,115 C 288,98 270,85 252,85 C 262,95 268,112 295,115 Z" />
  </g>

  <!-- Academic Torch & Tech Gear Symbol in Center -->
  <g transform="translate(200, 155)">
    <!-- Gear cog rim -->
    <circle cx="0" cy="0" r="48" fill="#091b36" stroke="url(#gipaGold)" stroke-width="4" />
    <!-- Gear teeth -->
    <path d="M-8,-52 L8,-52 L6,-46 L-6,-46 Z" fill="url(#gipaGold)" />
    <path d="M-8,52 L8,52 L6,46 L-6,46 Z" fill="url(#gipaGold)" />
    <path d="M-52,-8 L-52,8 L-46,6 L-46,-6 Z" fill="url(#gipaGold)" />
    <path d="M52,-8 L52,8 L46,6 L46,-6 Z" fill="url(#gipaGold)" />
    <path d="M-36,-36 L-25,-47 L-21,-43 L-32,-32 Z" fill="url(#gipaGold)" />
    <path d="M36,36 L25,47 L21,43 L32,32 Z" fill="url(#gipaGold)" />
    <path d="M-36,36 L-47,25 L-43,21 L-32,32 Z" fill="url(#gipaGold)" />
    <path d="M36,-36 L47,-25 L43,-21 L32,-32 Z" fill="url(#gipaGold)" />

    <!-- Open Book / Academic Knowledge Base -->
    <path d="M-28,12 Q-14,4 0,10 Q14,4 28,12 L24,24 Q12,18 0,22 Q-12,18 -24,24 Z" fill="url(#gipaGold)" />
    <!-- Torch Flame of Education -->
    <path d="M0,-30 C-10,-18 -12,-8 0,6 C12,-8 10,-18 0,-30 Z" fill="#fff" opacity="0.9" />
    <path d="M0,-24 C-6,-14 -8,-6 0,4 C8,-6 6,-14 0,-24 Z" fill="url(#gipaGold)" />
  </g>

  <!-- GIPA Acronym Typography -->
  <text x="200" y="260" font-family="'Cinzel', serif, system-ui" font-size="34" font-weight="900" fill="url(#gipaGold)" text-anchor="middle" letter-spacing="4">
    GIPA
  </text>

  <!-- Full Title Arc / Subtext -->
  <text x="200" y="288" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fcedbe" text-anchor="middle" letter-spacing="1.5">
    GRAND INSTITUTE
  </text>
  <text x="200" y="306" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#c2cbd8" text-anchor="middle" letter-spacing="1">
    FOR PRACTICAL APPLICATION
  </text>
  <text x="200" y="324" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="url(#gipaGold)" text-anchor="middle" letter-spacing="2">
    SULTANATE OF OMAN
  </text>
</svg>
